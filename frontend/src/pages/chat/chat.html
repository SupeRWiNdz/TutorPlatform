@if (user) {
  <button [routerLink]="'/profile/' + user.username">Профиль</button>
  <h2>{{ user.full_name }}</h2>
  @if (hasMore$ | async)
  {
    <button (click)="loadMoreMessages()">ЗАГРУЗИТЬ</button>
  }
  @for (message of messages$ | async; track message.id || $index) {
    @if (message) {
      <div [style.color]="message.type === 'outgoing' ? 'red' : 'blue'">
        {{ message.sent_at | date:'dd.MM HH:mm' }} {{ message.text }}
      </div>
    }
  } @empty {
    <div>Нет сообщений</div>
  }
  <input #messageInput>
  <button (click)="sendMessage(messageInput.value); messageInput.value = ''">Отправить</button>
}

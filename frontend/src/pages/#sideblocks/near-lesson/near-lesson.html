@if (lesson) {
<div class="block">
    <div [routerLink]="'/class/'+ lesson.class_link+ '/lessons/'" [state]="{ lesson_id: lesson.id }">
        <p>Следующее занятие через
            {{lesson.minutes_until_start | minutesToReadable}}:</p>
        <p class="class-name">{{lesson.class_name | truncate:35}}</p>
        @if (lesson.homework)
        { <p>(ДЗ: {{lesson.homework}})</p>}
        <p>{{lesson.date}} {{lesson.time_start}}-{{lesson.time_end}}</p>
    </div>
</div>
}

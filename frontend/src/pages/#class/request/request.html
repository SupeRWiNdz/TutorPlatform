@if (response && response.name) {
<div class="top-container">
    <div class="title">
        Приглашение в класс:
    </div>
</div>
<div class="bottom-container">
    <div class="inner-block">
        <p>{{response.name}}</p>
        <p class="description">{{response.description}}</p>
        <p>Дата создания класса: {{response.created_at | date:'dd.MM.yyyy HH:mm'}}</p>
        <button mat-raised-button (click)="accept()">Принять</button>
        <button mat-raised-button (click)="decline()">Отклонить</button>
    </div>
</div>
}

@if (class.name) {
<div class="top-container">
    <div class="title">
        {{class.name}}
        <button mat-mini-fab matSuffix [routerLink]="'/class/'+this.class.link+'/info/'"
            [attr.aria-label]="'Информация'"><mat-icon>info</mat-icon></button>
    </div>
</div>
@if (messages$)
{
@if (hasMore$ | async) {
<button (click)="loadMoreMessages()" mat-button>ЗАГРУЗИТЬ</button>
}

@for (message of messages$ | async; track message.message_number) {
@if (message) {
<div [style.color]="message.type === 'outgoing' ? 'red' : 'blue'">
    {{ message.sent_at | date:'dd.MM HH:mm' }}
    <span [innerHTML]="message.text | advancedFormatMessage"></span>
</div>
}
} @empty {
<div>Нет сообщений</div>
}

<form [formGroup]="chatForm">
    <mat-form-field appearance="fill">
        <input matInput type="text" formControlName="message" placeholder="Сообщение">
        <button matIconButton matSuffix (click)="sendMessage()"
            [attr.aria-label]="'Отправить'"><mat-icon>send</mat-icon></button>
    </mat-form-field>
</form>

} @else { <mat-spinner></mat-spinner> }
}
@else if (class.message) {{{ class.message }}}

@if (classes$ | async; as response) {
  @if (isCreating)
  {
    <form [formGroup]="createClassForm">
            Название:
            <input formControlName="name">
            Ссылка:
            <input formControlName="link">
            Описание:
            <input formControlName="description">


            <button (click)="createClass()">Подтвердить</button>
            <button (click)="exitCreateMode()">Отмена</button>
        </form>
  }
  @else
  {
  <button (click)="createMode()">Создать новый</button>
    <h2>Всего классов: {{ response.total_classes }}</h2>
    
    @for (class of response.classes; track class.link) {
      <button class="class-card" (click)="navigateToClass(class.link)">
        <h3>{{ class.name }}</h3>
        <p>{{ class.description }}</p>
        
        <div class="class-info">
          <span>Участников: {{ class.total_members }}</span>
          <span>Ваша роль: {{ class.user_role }}</span>
        </div>
      </button><br>
    }
  }
} @else {
  <div class="loading">
    Загрузка классов...
  </div>
}

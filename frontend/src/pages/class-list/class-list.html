@if (classes$ | async; as response) {
  <div class="classes-container">
    <h2>Всего классов: {{ response.total_classes }}</h2>
    
    @for (class of response.classes; track class.link) {
      <div class="class-card" (click)="navigateToClass(class.link)">
        <h3>{{ class.name }}</h3>
        <p>{{ class.description }}</p>
        
        <div class="class-info">
          <span>Участников: {{ class.total_members }}</span>
          <span>Ваша роль: {{ class.user_role }}</span>
        </div>
      </div>
    }
  </div>
} @else {
  <div class="loading">
    Загрузка классов...
  </div>
}

<div class="chat-container">
  @if (user) {
  <div class="top-container">
    <div class="title">
        <span [innerHTML]="user.full_name | truncate: isTitleActive" (click)="showTitle()"></span>
      <button mat-mini-fab matSuffix [routerLink]="'/profile/' + user.username" [attr.aria-label]="'Профиль'">
        <mat-icon>person</mat-icon>
      </button>
    </div>
  </div>

  <div class="messages-container" #messagesContainer>
    @if (hasMore$ | async) {
    <div class="load-more-wrapper">
      <button mat-stroked-button (click)="loadMoreMessages()">
        <mat-icon>expand_less</mat-icon>
        ЗАГРУЗИТЬ ПРЕДЫДУЩИЕ
      </button>
    </div>
    }
    @for (message of messages$ | async; track message.id || $index) {

    @if (message) {
    <div class="message-wrapper" [class.outgoing]="message.type === 'outgoing'"
      [class.incoming]="message.type !== 'outgoing'">
      <div class="message-bubble">
        <div class="message-text" [innerHTML]="message.text | advancedFormatMessage"></div>
        <div class="message-meta">
          <span class="timestamp">{{ message.sent_at | dateToday }}</span>
          @if (message.type === 'outgoing') {
            @if (message.is_read) {<mat-icon class="read-status">done_all</mat-icon>}
            @else {<mat-icon class="read-status">check</mat-icon>}
          }
        </div>
      </div>
    </div>
    }
    } @empty {
    <div class="empty-messages">
      <mat-icon>chat_bubble_outline</mat-icon>
      <span>Нет сообщений</span>
    </div>
    }
  </div>

  <form [formGroup]="chatForm" (ngSubmit)="sendMessage()" class="message-form">
    <mat-form-field appearance="outline" class="message-input">
      <input matInput type="text" formControlName="message" placeholder="Введите сообщение...">
      <button mat-icon-button matSuffix type="submit" [disabled]="chatForm.invalid" [attr.aria-label]="'Отправить'">
        <mat-icon>send</mat-icon>
      </button>
    </mat-form-field>
  </form>
  }
</div>

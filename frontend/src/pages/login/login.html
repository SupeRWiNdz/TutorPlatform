<button mat-raised-button color="primary" [routerLink]="'/register'" type="button">Зарегистрироваться</button>
<h2>Войти в систему</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
<mat-form-field appearance="outline">
    <mat-label>Электронная почта</mat-label>
    <input matInput formControlName="email" placeholder="example@mail.com" >
    <mat-error>
    @if (form.get('email')?.errors?.['required'])
    {Введите почту}
    @else if (form.get('email')?.errors?.['email'])
    {Введите корректную почту}
    </mat-error>
</mat-form-field>
<mat-form-field appearance="outline">
    <mat-label>Пароль</mat-label>
    <input matInput [type]="hide() ? 'password' : 'text'" formControlName="password">
    <button
      type="button"
      matIconButton
      matSuffix
      (click)="clickEvent($event)"
      [attr.aria-label]="'Скрыть пароль'"
      [attr.aria-pressed]="hide()"
    >
      <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
    </button>
    <mat-error>
    @if (form.get('password')?.errors?.['required'])
    {Введите пароль}
    </mat-error>
</mat-form-field>
<button mat-raised-button type="submit">Подтвердить</button>
</form>

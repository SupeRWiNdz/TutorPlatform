<button [routerLink]="'/register'">Зарегистрироваться</button>
<h2>Войти в систему</h2>
<form [formGroup]="form" (ngSubmit)="onSubmit()">
Электронная почта:<input formControlName="email" placeholder="example@mail.com" >
Пароль:<input type="password" formControlName="password" placeholder="••••••••••">
    <button type="submit">Войти</button>
</form>
@if (errorMessage) {
    <strong>Ошибка</strong>
    <p>
        {{ errorMessage }}
    </p>
}

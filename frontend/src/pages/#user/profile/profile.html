@if (user) {
<div class="top-container">
  <div class="title">
    <span [innerHTML]="user.full_name | truncate: isTitleActive" (click)="showTitle()"></span>
    <button mat-icon-button [matMenuTriggerFor]="user_menu"><mat-icon>more_vert</mat-icon></button>
    <mat-menu #user_menu>
      <button mat-menu-item [routerLink]="'/chat/' + user.username">Сообщения<mat-icon
          matTextPrefix>message</mat-icon></button>
    </mat-menu>
  </div>
</div>
<div class="bottom-container">
  <div class="inner-block">
    <p>
      @if (user.is_teacher) {Учитель}
      @if (user.is_student) {Ученик}
      @if (user.is_parent) {Родитель}
    </p>
    <p>
      Дата рождения: {{ user.birth_date | date:'dd.MM.yyyy' }}
    </p>
  </div>
</div>
}

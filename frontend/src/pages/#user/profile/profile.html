@if (user) {
  <h2>{{ user.full_name }}</h2>
  <span>{{ user.birth_date | date:'dd.MM.yyyy' }}</span>
  
  @if (user.gender === 'M') {<mat-icon>male</mat-icon>}
  @if (user.gender === 'F') {<mat-icon>female</mat-icon>}
  <button
      mat-mini-fab
      matSuffix
      [routerLink]="'/chat/' + user.username"
      [attr.aria-label]="'Личный чат'"
      ><mat-icon>message</mat-icon></button>
}
